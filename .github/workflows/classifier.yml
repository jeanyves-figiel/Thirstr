# Public-photo classifier (F-15 R-15.10, #26): deploys infra/classifier to thirstr-classifier-<env>.
# Push to main → staging. Prod only by manual dispatch (release orchestrator).
# Skips cleanly while the Fly app does not exist yet (no spend until the owner approves it).
name: Deploy classifier

on:
  push:
    branches: [main]
    paths:
      - infra/classifier/**
      - infra/fly/classifier-*.toml
      - .github/workflows/classifier.yml
  workflow_dispatch:
    inputs:
      env:
        description: "staging or prod"
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-classifier-${{ inputs.env || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'prod' && 'production' || 'staging' }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }}
      ENV: ${{ inputs.env || 'staging' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: case "$ENV" in staging|prod) ;; *) echo "unknown env $ENV"; exit 1 ;; esac
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master
      - id: app
        run: |
          if flyctl status --app "thirstr-classifier-$ENV" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::thirstr-classifier-$ENV not created yet (docs/runbooks/classifier.md); skipping."
          fi
      - if: steps.app.outputs.exists == 'true'
        run: flyctl deploy --config "infra/fly/classifier-$ENV.toml" --app "thirstr-classifier-$ENV" --remote-only --ha=false --wait-timeout 300
