# ops.md › Trunk model step 3: squash-merge to main → build signed image → deploy staging by digest → smoke.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # cosign keyless signing

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE: registry.fly.io/thirstr-api-staging

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }} # job-scoped (semgrep gha-workflow-env-secret)
    environment: staging
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master
      - run: flyctl auth docker
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # #26: DB-IP City Lite is monthly; the month keys the cached `geo` stage.
      - id: month
        run: echo "dbip=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            DBIP_MONTH=${{ steps.month.outputs.dbip }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          artifact-name: sbom-${{ github.sha }}.spdx.json
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  deploy:
    needs: build
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }} # job-scoped (semgrep gha-workflow-env-secret)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.thirstr.fun
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master
      - name: Deploy by digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: flyctl deploy --config infra/fly/api-staging.toml --app thirstr-api-staging --image "${IMAGE}@${DIGEST}" --wait-timeout 300
      - name: Smoke
        run: ./scripts/smoke.sh https://staging.thirstr.fun "${GITHUB_SHA}"
