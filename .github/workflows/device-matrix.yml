# EN-16 (#175): device test matrix (testing.md › Device matrix). Nightly + manual. No paid device farm:
# Android emulators (low-end + 3G, mid) against a hermetic DEV stack on the runner, and an old-iPhone
# simulator over 3G against staging (signed out, read-only). Budgets: apps/mobile/e2e/budgets.json.
name: Device matrix

on:
  # Also on PRs that change the matrix itself (flows, scripts, budgets, this file).
  pull_request:
    paths:
      - apps/mobile/e2e/**
      - scripts/device-matrix/**
      - infra/e2e/**
      - .github/workflows/device-matrix.yml
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      profiles:
        description: Profiles to run
        type: choice
        options: [all, android-low, android-mid, ios-old, android-real]
        default: all

permissions:
  contents: read

concurrency:
  group: device-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"

jobs:
  android-build:
    if: ${{ (inputs.profiles || 'all') == 'all' || startsWith(inputs.profiles, 'android') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # E2E-only build: DEV sign-in issuer, API on the runner as seen from the emulator.
      EXPO_PUBLIC_ENV: dev
      EXPO_PUBLIC_API_URL: http://10.0.2.2:4000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Allow cleartext HTTP to the runner (this E2E APK only)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          if grep -q 'usesCleartextTraffic' "$f"; then sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/' "$f"
          else sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$f"; fi
          grep -o 'usesCleartextTraffic="[a-z]*"' "$f"
      - name: Release APK (x86_64)
        run: cd android && ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3

  android:
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: android-low
            api: 30
            device: Galaxy Nexus  # 720×1280, 320 dpi
            ram: 2048M
            cores: 2
            net: -netspeed umts -netdelay umts
          - profile: android-mid
            api: 35
            device: pixel_6  # 1080×2400, 420 dpi
            ram: 4096M
            cores: 4
            net: -netspeed full -netdelay none
    steps:
      - name: Skip profiles not asked for
        id: want
        env:
          WANT: ${{ (inputs.profiles || 'all') == 'all' || inputs.profiles == matrix.profile }}
        run: echo "run=$WANT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.want.outputs.run == 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.want.outputs.run == 'true'
        with:
          name: e2e-apk
          path: ${{ runner.temp }}/apk
      - name: Hermetic backend (DEV stack, no staging)
        if: steps.want.outputs.run == 'true'
        run: |
          sudo ip addr add 10.0.2.2/32 dev lo   # same address the emulator uses for the runner
          docker compose -f docker-compose.yml -f infra/e2e/compose.e2e.yml up -d api
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.want.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/testbot/package-lock.json
      - name: Build Testbot
        if: steps.want.outputs.run == 'true'
        working-directory: apps/testbot
        run: npm ci && npm run build
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.want.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Install Maestro
        if: steps.want.outputs.run == 'true'
        run: |
          ./scripts/device-matrix/install-maestro.sh
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Wait for API, start Testbot
        if: steps.want.outputs.run == 'true'
        run: |
          for i in $(seq 120); do curl -fs http://localhost:4000/v1/health && break; sleep 5; done
          curl -fsS http://localhost:4000/v1/health || { docker compose logs api | tail -80; exit 1; }
          cd apps/testbot
          API_URL=http://localhost:4000 TESTBOT_KEY=e2e-device-matrix-testbot-key-0001 BOTS=testbot \
            BOT_DATA_DIR="$RUNNER_TEMP/bot" BOT_POLL_MS=3000 nohup npm start > "$RUNNER_TEMP/testbot.log" 2>&1 &
          for i in $(seq 60); do grep -q "test bots up" "$RUNNER_TEMP/testbot.log" && break; sleep 2; done
          tail -5 "$RUNNER_TEMP/testbot.log"
      - name: Enable KVM
        if: steps.want.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: ${{ matrix.profile }} flows
        if: steps.want.outputs.run == 'true'
        env:
          PROFILE: ${{ matrix.profile }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: ${{ matrix.device }}
          ram-size: ${{ matrix.ram }}
          cores: ${{ matrix.cores }}
          disk-size: 6000M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none ${{ matrix.net }}
          script: ./scripts/device-matrix/android-run.sh "$PROFILE" "$RUNNER_TEMP/apk/app-release.apk" "$RUNNER_TEMP/out"
      - name: Budgets
        if: always() && steps.want.outputs.run == 'true'
        env:
          PROFILE: ${{ matrix.profile }}
        run: python3 scripts/device-matrix/budgets.py "$PROFILE" "$RUNNER_TEMP/out/metrics.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Collect logs
        if: always() && steps.want.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/testbot.log" "$RUNNER_TEMP/out/" 2>/dev/null || true
          docker compose logs api > "$RUNNER_TEMP/out/api.log" 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.want.outputs.run == 'true'
        with:
          name: device-matrix-${{ matrix.profile }}
          path: ${{ runner.temp }}/out
          retention-days: 14

  ios-old:
    if: ${{ (inputs.profiles || 'all') == 'all' || inputs.profiles == 'ios-old' }}
    runs-on: xcode-27  # same image as TestFlight builds (#73)
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_API_URL: https://staging.thirstr.fun
      EXPO_PUBLIC_ENV: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - name: Newest release Xcode
        run: |
          x=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|_rc|release.?candidate' | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version
      - name: Build for simulator (Release)
        working-directory: apps/mobile
        run: |
          npm ci
          npx expo prebuild --platform ios --clean
          xcodebuild build -workspace ios/Thirstr.xcworkspace -scheme Thirstr -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1 && ok=0 || ok=$?
          grep -nE "error:|\*\* BUILD" "$RUNNER_TEMP/build.log" | head -40
          exit "$ok"
      - name: Install Maestro
        run: |
          ./scripts/device-matrix/install-maestro.sh
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: ios-old flows (3G, staging, signed out)
        run: |
          app=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Release-iphonesimulator/*.app | head -1)
          ./scripts/device-matrix/ios-run.sh "$app" "$RUNNER_TEMP/out"
      - name: Budgets
        if: always()
        run: python3 scripts/device-matrix/budgets.py ios-old "$RUNNER_TEMP/out/metrics.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: device-matrix-ios-old
          path: ${{ runner.temp }}/out
          retention-days: 14

  # Real low-end Android phone on Firebase Test Lab (owner pick 2026-11-21: free Spark tier, ≤ 5 physical
  # runs/day, Google-hosted). Robo crawl of a staging build, signed out. Skips until the Firebase
  # project exists (variables GCP_WIF_PROVIDER, GCP_SA_EMAIL, FIREBASE_PROJECT_ID; keyless, testing.md › Real devices).
  android-real:
    if: ${{ github.event_name != 'pull_request' && ((inputs.profiles || 'all') == 'all' || inputs.profiles == 'android-real') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write  # keyless: GitHub OIDC → Workload Identity Federation, no JSON key
    env:
      HAS_TESTLAB: ${{ vars.GCP_WIF_PROVIDER != '' && vars.FIREBASE_PROJECT_ID != '' }}
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_ENV: staging
      EXPO_PUBLIC_API_URL: https://staging.thirstr.fun
    steps:
      - name: Firebase Test Lab configured?
        run: |
          if [ "$HAS_TESTLAB" != true ]; then
            echo "::notice::Firebase Test Lab not set up yet (variables GCP_WIF_PROVIDER, GCP_SA_EMAIL, FIREBASE_PROJECT_ID); skipping real device."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.HAS_TESTLAB == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.HAS_TESTLAB == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: env.HAS_TESTLAB == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        if: env.HAS_TESTLAB == 'true'
      - name: Staging release APK (arm64)
        if: env.HAS_TESTLAB == 'true'
        working-directory: apps/mobile
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=arm64-v8a
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        if: env.HAS_TESTLAB == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        if: env.HAS_TESTLAB == 'true'
      - name: Robo test on the most low-end physical phone
        if: env.HAS_TESTLAB == 'true'
        env:
          TESTLAB_DEVICE: ${{ vars.TESTLAB_DEVICE }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          dev="$TESTLAB_DEVICE"
          [ -n "$dev" ] || dev=$(gcloud firebase test android models list --project "$PROJECT" --format=json | python3 scripts/device-matrix/testlab-pick.py)
          echo "Device: $dev"
          gcloud firebase test android run --project "$PROJECT" --type robo --app "$apk" --device "$dev" \
            --timeout 300s --results-history-name thirstr-device-matrix --no-record-video \
            2>&1 | tee "$RUNNER_TEMP/out/testlab.log" || true
          matrix=$(grep -oE 'matrices/[0-9]+' "$RUNNER_TEMP/out/testlab.log" | head -1 | cut -d/ -f2)
          [ -n "$matrix" ] || { echo "::error::no Test Lab matrix id"; exit 1; }
          python3 scripts/device-matrix/testlab-metrics.py "$PROJECT" "$matrix" "$(gcloud auth print-access-token)" > "$RUNNER_TEMP/out/metrics.json"
          python3 - "$RUNNER_TEMP/out/metrics.json" "$dev" "$apk" <<'PY'
          import json, os, subprocess, sys
          p, dev, apk = sys.argv[1:]
          d = json.load(open(p)); d["device"] = dev; d["apk_bytes"] = os.path.getsize(apk)
          out = subprocess.run(["unzip", "-l", apk, "assets/index.android.bundle"], capture_output=True, text=True).stdout.splitlines()
          d["js_bundle_bytes"] = int(out[3].split()[0]) if len(out) > 3 else None
          json.dump(d, open(p, "w"), indent=1)
          PY
          cat "$RUNNER_TEMP/out/metrics.json"
      - name: Budgets
        if: always() && env.HAS_TESTLAB == 'true'
        run: python3 scripts/device-matrix/budgets.py android-real "$RUNNER_TEMP/out/metrics.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && env.HAS_TESTLAB == 'true'
        with:
          name: device-matrix-android-real
          path: ${{ runner.temp }}/out
          retention-days: 14
