# EN-17 (#176) disaster-recovery drill: restore the database into ANOTHER EU region from backups only,
# measure RTO/RPO, check the copy for corruption (amcheck, DB-08), dry-run the migrations of the image live on staging, then destroy everything.
# Runbook: docs/runbooks/db-backups.md › Automated drill. Result → run summary + comment on the "DR drill log" issue.
# Cost: temporary shared-cpu-1x machines + volume for ~5–10 min per run (a few cents).
name: DR drill

on:
  schedule:
    - cron: "17 4 1 * *" # monthly (ops.md, DB-08 #333), 1st of the month 04:17 UTC (quiet hour)
  workflow_dispatch:
    inputs:
      env:
        description: "Which database"
        type: choice
        options: [prod, staging]
        default: prod
      region:
        description: "Restore into (EU only, not fra = the live region)"
        type: choice
        options: [ams, cdg, arn]
        default: ams

permissions:
  contents: read
  issues: write

concurrency:
  group: dr-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ (inputs.env || 'prod') == 'prod' && 'production' || 'staging' }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }}
      DRILL_ENV: ${{ inputs.env || 'prod' }}
      DRILL_REGION: ${{ inputs.region || 'ams' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image to dry-run (live on staging)
        id: img
        run: echo "image=$(./scripts/fly-live-image.sh thirstr-api-staging | jq -r .image)" >> "$GITHUB_OUTPUT"
      - name: Restore drill + migration dry run
        id: drill
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          set -o pipefail
          ./scripts/ops/restore-drill.sh "$DRILL_ENV" "$DRILL_REGION" --migrate-image "$IMAGE" | tee result.json
      - name: Log result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.drill.outcome }}
          RUN_URL: ${{ github.server_url }}/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}
        run: |
          r=$(cat result.json 2>/dev/null || echo '{}')
          ok=$([[ "$OUTCOME" == "success" ]] && echo "✔" || echo "✘ failed")
          row=$(jq -r --arg ok "$ok" --arg run "$RUN_URL" '
            "| \(.at // (now|todate)) | \(.env // env.DRILL_ENV) | \(.region // env.DRILL_REGION) | \($ok) | \(.rto_s // "–") s | \(.rpo_s // "–") s | \(.accounts // "–") | \(.amcheck // "–") | \(.migrate // "–") | [run](\($run)) |"' <<<"$r")
          { echo "| Date | Env | Region | Result | RTO (usable DB) | RPO (WAL lag) | accounts | amcheck | migrations | |"; echo "|---|---|---|---|---|---|---|---|---|---|"; echo "$row"; } >> "$GITHUB_STEP_SUMMARY"
          gh label create dr-drill --repo "$GITHUB_REPOSITORY" --color 3DD6C3 --description "DR drill log (EN-17)" --force >/dev/null
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label dr-drill --state open --json number --jq '.[0].number // empty')
          [[ -n "$n" ]] || n=$(gh issue create --repo "$GITHUB_REPOSITORY" --label dr-drill --title "DR drill log" \
            --body "Automated disaster-recovery drills (EN-17, #176). One comment per run. Runbook: docs/runbooks/db-backups.md › Automated drill. Targets: enterprise-readiness.md › 1 (RTO 4 h, RPO 5 min in closed beta)." | grep -o '[0-9]*$')
          gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$(printf '| Date | Env | Region | Result | RTO | RPO | accounts | amcheck | migrations | |\n|---|---|---|---|---|---|---|---|---|---|\n%s' "$row")"
