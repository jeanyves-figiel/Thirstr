# Builds the Postgres 16 + h3 image used by the Fly DB machines (thirstr-db-<env>).
name: Infra images

on:
  workflow_dispatch:
    inputs:
      envs:
        description: "Registries to push to (space separated). Running DB machines change only when updated to the new digest (docs/runbooks/db-backups.md)."
        default: "staging prod"
  push:
    branches: [main]
    paths: ["infra/postgres/**"]

permissions:
  contents: read

jobs:
  envs:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.l.outputs.list }}
    steps:
      - id: l
        env:
          ENVS: ${{ inputs.envs || 'staging prod' }}
        run: |
          for env in $ENVS; do case "$env" in staging|prod) ;; *) echo "unknown env $env"; exit 1 ;; esac; done
          echo "list=$(jq -cn --arg e "$ENVS" '$e | split(" ") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  # EN-09 (#168): one job per environment, each with only that environment's Fly token.
  postgres:
    needs: envs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJson(needs.envs.outputs.list) }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }} # job-scoped (semgrep gha-workflow-env-secret)
    environment: ${{ matrix.env == 'prod' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master
      - run: flyctl auth docker
      - env:
          ENV: ${{ matrix.env }}
        run: |
          docker build -t thirstr-postgres:16 infra/postgres
          for tag in pg16-h3 pg16-h3-${GITHUB_SHA::7}; do
            docker tag thirstr-postgres:16 registry.fly.io/thirstr-db-$ENV:$tag
            docker push registry.fly.io/thirstr-db-$ENV:$tag
          done
          echo "thirstr-db-$ENV: $(docker inspect --format '{{index .RepoDigests 0}}' registry.fly.io/thirstr-db-$ENV:pg16-h3)" >> "$GITHUB_STEP_SUMMARY"
