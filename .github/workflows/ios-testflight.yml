# iOS beta builds (#31): GitHub macOS runner → xcodebuild → App Store Connect → TestFlight.
# App talks to staging. Signing is Xcode automatic signing driven by the App Store Connect
# API key (-allowProvisioningUpdates): Apple creates/keeps the distribution certificate and
# profile; nothing signing-related lives in this repo. Runbook: docs/runbooks/ios.md
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build (default = the branch you run on). Older commits ship for comparison tests (#93).
        required: false
        default: ''
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/ios-testflight.yml"]

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false  # finish the running build; newer pushes queue and only the latest waiting one runs

env:
  EXPO_PUBLIC_API_URL: https://staging.thirstr.fun
  EXPO_PUBLIC_ENV: staging
  # Build numbers must only grow; 100+ keeps clear of the early EAS builds.
  BUILD_NUMBER_OFFSET: 100

jobs:
  testflight:
    runs-on: xcode-27  # GitHub image with release Xcode 27 / iOS 27 SDK, macOS 27, arm64 (#73)
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Owner setup present?
        id: gate
        working-directory: .
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::iOS build skipped, missing secrets:$missing (see docs/runbooks/ios.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - if: steps.gate.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Newest release Xcode
        if: steps.gate.outputs.ok == 'true'
        working-directory: .
        run: |
          # Newest non-beta Xcode on the image (betas/RCs can't upload to the App Store, #73).
          x=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|_rc|release.?candidate' | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; else echo "No Xcode_*.app, keeping image default"; fi
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $sdk"
          [ "${sdk%%.*}" -ge 27 ] || echo "::warning::iOS SDK $sdk < 27: App Store Connect rejects it from April 2027 (ITMS-90725, #73)"

      - if: steps.gate.outputs.ok == 'true'
        run: npm ci

      - name: API key file
        if: steps.gate.outputs.ok == 'true'
        working-directory: .
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Revoke CI development certificates (Apple caps their number)
        if: steps.gate.outputs.ok == 'true'
        working-directory: .
        run: |
          if [ -f .github/scripts/asc-revoke-ci-dev-certs.mjs ]; then node .github/scripts/asc-revoke-ci-dev-certs.mjs; else echo "Older commit, no revoke script"; fi

      - name: Register app extension bundle IDs (automatic signing can't, #119)
        if: steps.gate.outputs.ok == 'true'
        working-directory: .
        run: |
          if [ -f .github/scripts/asc-ensure-bundle-ids.mjs ]; then node .github/scripts/asc-ensure-bundle-ids.mjs "app.thirstr.safetylive=Thirstr Safety Live"; else echo "Older commit, no extensions"; fi

      - name: Native project (expo prebuild)
        if: steps.gate.outputs.ok == 'true'
        run: |
          build=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))
          IOS_BUILD_NUMBER=$build npx expo prebuild --platform ios --clean
          # Older commits don't read IOS_BUILD_NUMBER; set it directly so any ref uploads.
          plutil -replace CFBundleVersion -string "$build" ios/Thirstr/Info.plist

      - name: Archive
        if: steps.gate.outputs.ok == 'true'
        run: |
          build=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))
          xcodebuild archive \
            -workspace ios/Thirstr.xcworkspace -scheme Thirstr -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Thirstr.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$build" \
            > "$RUNNER_TEMP/archive.log" 2>&1 && ok=0 || ok=$?
          tail -n 200 "$RUNNER_TEMP/archive.log"
          if [ "$ok" -ne 0 ]; then
            echo "::group::Errors"
            grep -nE "error:|error [A-Z]+[0-9]+|\*\* ARCHIVE FAILED|The following build commands failed" -A4 "$RUNNER_TEMP/archive.log" | head -n 120
            echo "::endgroup::"
          fi
          exit "$ok"

      - name: Inspect archive (code bundle present?)
        if: steps.gate.outputs.ok == 'true'
        run: |
          app="$RUNNER_TEMP/Thirstr.xcarchive/Products/Applications/Thirstr.app"
          ls -la "$app" | head -80
          if [ -s "$app/main.jsbundle" ]; then
            echo "main.jsbundle: $(wc -c < "$app/main.jsbundle") bytes"; head -c 16 "$app/main.jsbundle" | xxd
          else
            echo "::error::main.jsbundle missing or empty in the archive"
          fi
          plutil -p "$app/Info.plist" | grep -E "CFBundleVersion|CFBundleShortVersionString|UILaunchStoryboardName|EXUpdates|RCT" || true
          ls "$app/Frameworks" | head -40
          codesign -d --entitlements :- "$app" 2>/dev/null | head -40 || true

      - name: Export and upload to TestFlight
        if: steps.gate.outputs.ok == 'true'
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Thirstr.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET)); Apple processing takes ~5-15 min."

      - name: Revoke this run's development certificate
        if: always() && steps.gate.outputs.ok == 'true'
        working-directory: .
        run: |
          if [ -f .github/scripts/asc-revoke-ci-dev-certs.mjs ]; then node .github/scripts/asc-revoke-ci-dev-certs.mjs; else echo "Older commit, no revoke script"; fi

      - name: Remove key file
        if: always()
        working-directory: .
        run: rm -rf "$RUNNER_TEMP/keys"
