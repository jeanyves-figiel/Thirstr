# ops.md › nightly: dependency/security sweep. Abuse harnesses (trilateration, scraping,
# quarantine, Safe Mode leaks) are added here as their features land (tracked in GitHub).
name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27.1.2"
          elixir-version: "1.17.3"
      - name: mix deps.audit
        working-directory: server
        run: mix deps.get && mix deps.audit
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: core
        run: cargo audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: npm audit (runtime deps)
        working-directory: apps/mobile
        run: npm ci && npm audit --omit=dev --audit-level=high
      - name: Staging smoke
        run: ./scripts/smoke.sh https://staging.thirstr.fun
