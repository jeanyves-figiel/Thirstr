# ops.md › nightly: dependency/security sweep. Abuse harnesses (trilateration, scraping,
# quarantine, Safe Mode leaks) are added here as their features land (tracked in GitHub).
name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # EN-09 (#168, docs/runbooks/access.md §3): fail 14 days before a Fly CI token expires, so the
  # owner gets the failure mail in time to run scripts/ops/fly-ci-tokens.sh.
  token-expiry:
    runs-on: ubuntu-latest
    steps:
      - env:
          STAGING: ${{ vars.FLY_TOKEN_EXPIRES_STAGING }}
          PRODUCTION: ${{ vars.FLY_TOKEN_EXPIRES_PRODUCTION }}
        run: |
          rc=0
          for name in STAGING PRODUCTION; do
            d="${!name}"
            if [[ -z "$d" ]]; then echo "::warning::FLY_TOKEN_EXPIRES_$name not set (old repo-wide token still in use?)"; continue; fi
            left=$(( ($(date -u -d "$d" +%s) - $(date -u +%s)) / 86400 ))
            echo "Fly CI token ${name,,}: expires $d ($left days)"
            if (( left < 14 )); then echo "::error::Fly CI token ${name,,} expires in $left days: run scripts/ops/fly-ci-tokens.sh ${name,,}"; rc=1; fi
          done
          exit $rc

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.1.2"
          elixir-version: "1.17.3"
      - name: mix deps.audit
        working-directory: server
        run: mix deps.get && mix deps.audit
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: core
        run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (runtime deps)
        working-directory: apps/mobile
        run: npm ci && npm audit --omit=dev --audit-level=high
      - name: Staging smoke
        run: ./scripts/smoke.sh https://staging.thirstr.fun
