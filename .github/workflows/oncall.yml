# EN-06 (#165): on-call alerts. Every 5 min, outside Fly: evaluate infra/alerts/rules.json
# (Fly Prometheus + HTTPS/TLS probes) and push to Pushover with a runbook link
# (docs/runbooks/alerts.md). Inert until PUSHOVER_APP_TOKEN + PUSHOVER_USER_KEY exist.
# Setup and rotation: docs/runbooks/on-call.md.
name: On-call alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_page:
        description: Send a test push now
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/oncall.yml
      - scripts/ops/oncall.py
      - infra/alerts/**
      - docs/runbooks/alerts.md

permissions:
  contents: read

concurrency:
  group: oncall-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FLY_METRICS_TOKEN: ${{ secrets.FLY_METRICS_TOKEN || secrets.FLY_TOKEN }}
      PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
      PUSHOVER_ESCALATION_KEY: ${{ secrets.PUSHOVER_ESCALATION_KEY }}
      # EN-23 OB-2: synthetic chat probe; unset = probe rules show "not run"
      PROBE_KEY_PROD: ${{ secrets.PROBE_KEY_PROD }}
      PROBE_KEY_STAGING: ${{ secrets.PROBE_KEY_STAGING }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ops
            infra/alerts
            docs/runbooks
            apps/testbot
            apps/mobile/src/chat
      - name: Unit tests
        run: python3 -m unittest scripts/ops/test_oncall.py
      - name: Restore alert state
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: oncall-state.json
          key: oncall-state-${{ github.run_id }}
          restore-keys: oncall-state-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.PROBE_KEY_PROD != '' || env.PROBE_KEY_STAGING != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/testbot/package-lock.json
      - name: Chat probe, prod + staging (EN-23 OB-2)
        if: env.PROBE_KEY_PROD != '' || env.PROBE_KEY_STAGING != ''
        working-directory: apps/testbot
        run: |
          npm ci --no-audit --no-fund --silent && npm run build --silent
          if [ -n "$PROBE_KEY_PROD" ]; then
            API_URL=https://api.thirstr.fun PROBE_KEY="$PROBE_KEY_PROD" PROBE_OUT=../../probe-prod.json timeout 90 node dist/probe.mjs &
          fi
          if [ -n "$PROBE_KEY_STAGING" ]; then
            API_URL=https://staging.thirstr.fun PROBE_KEY="$PROBE_KEY_STAGING" PROBE_OUT=../../probe-staging.json timeout 90 node dist/probe.mjs &
          fi
          wait
      - name: Evaluate (PR = dry run, nothing pushed)
        id: eval
        env:
          EVENT: ${{ github.event_name }}
          TEST_PAGE: ${{ inputs.test_page }}
        run: |
          args="--state oncall-state.json"
          if [ "$EVENT" = "pull_request" ]; then args="$args --dry-run"; fi
          if [ "$TEST_PAGE" = "true" ]; then args="$args --test-page"; fi
          python3 scripts/ops/oncall.py $args
      - name: Save alert state
        if: steps.eval.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: oncall-state.json
          key: oncall-state-${{ github.run_id }}-${{ github.run_attempt }}
