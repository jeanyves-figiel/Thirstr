# EN-04 (#163) public status page status.thirstr.fun (docs/spec/slos.md › 6, runbook docs/runbooks/status-page.md).
# Probes prod from GitHub every 5 min, keeps history on the `status-data` branch (never main: no staging redeploy),
# publishes status/ + data to GitHub Pages. Incident issues (label `incident` / `maintenance`) refresh it within ~1 min.
name: Status page

on:
  schedule:
    - cron: "*/5 * * * *"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["status/**", ".github/workflows/status.yml"]

permissions:
  contents: write # push status-data
  issues: write # auto-open an incident when a component is down
  pages: write
  actions: read # deploy-pages looks up the uploaded artifact
  id-token: write

concurrency:
  group: status-page
  cancel-in-progress: false

jobs:
  probe:
    # issue events only matter for incident/maintenance issues
    if: >-
      github.event_name != 'issues' && github.event_name != 'issue_comment' ||
      contains(join(github.event.issue.labels.*.name, ','), 'incident') ||
      contains(join(github.event.issue.labels.*.name, ','), 'maintenance')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            status
            web/site/fonts
            web/site/favicon.svg
      - name: Data branch
        run: |
          if git ls-remote --exit-code --heads origin status-data >/dev/null; then
            git fetch --depth=1 origin status-data
            git worktree add data FETCH_HEAD
          else
            git worktree add --detach data
            git -C data checkout --orphan status-data
            git -C data rm -rfq .
          fi
      - name: Labels (once per change)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          L() { gh label create "$1" --repo "$GITHUB_REPOSITORY" --color "$2" --description "$3" --force >/dev/null; }
          L incident FF4D6D "Shown on status.thirstr.fun"; L maintenance A78BFA "Planned maintenance on status.thirstr.fun"
          L investigating FFC93C "Incident state"; L identified FFC93C "Incident state"; L monitoring 3DD6C3 "Incident state"
          for s in 1 2 3 4; do L "sev-$s" 39346A "Incident severity (incident-response.md)"; done
          for c in sign chat explore media push site; do L "affects:$c" 2E2A55 "Status page component"; done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Probe + incidents
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # optional repo secret: read-only Fly token (Notifications row + month p95 tiles); without it they are hidden
          FLY_PROM_TOKEN: ${{ secrets.FLY_PROM_TOKEN }}
          STATUS_AUTO_INCIDENT: ${{ vars.STATUS_AUTO_INCIDENT || '1' }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in issues|issue_comment|push) node status/probe.mjs data --no-probe ;; *) node status/probe.mjs data ;; esac
      - name: Save history
        run: |
          cd data
          git config user.name "thirstr-status"; git config user.email "status@thirstr.fun"
          git add -A
          git commit -qm "status $(date -u +%FT%TZ)" || exit 0
          git push -q origin HEAD:status-data || { git fetch -q origin status-data && git rebase -q FETCH_HEAD && git push -q origin HEAD:status-data; }
      - name: Build site
        run: |
          mkdir -p _site/fonts
          cp status/index.html _site/; cp web/site/favicon.svg _site/
          cp web/site/fonts/bricolage-grotesque-latin-{400,800}-normal.woff2 _site/fonts/
          cp data/status.json data/feed.xml _site/
          echo "status.thirstr.fun" > _site/CNAME
      # Publishing waits for the owner to enable Pages (runbook status-page.md) and set repo variable STATUS_PAGE=on;
      # probes and history run from the first merge.
      - if: vars.STATUS_PAGE == 'on'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - if: vars.STATUS_PAGE == 'on'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
