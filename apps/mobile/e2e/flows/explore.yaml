# EN-16 (#175) Explore: map + Active now sheet, open the Testbot profile by its share link.
appId: app.thirstr
name: explore
---
- runFlow: dismiss.yaml
- tapOn:
    id: tab-Explore
- extendedWaitUntil:
    visible:
      id: grid-sheet
    timeout: 60000
- takeScreenshot: explore-map
- tapOn:
    id: sheet-handle
- takeScreenshot: explore-grid
# Testbot's own share link (logged by the bot at start): the seeded city has 99+ profiles.
- openLink: thirstr://p/${TESTBOT_SLUG}
- extendedWaitUntil:
    visible:
      id: message-btn
    timeout: 60000
- takeScreenshot: explore-profile
