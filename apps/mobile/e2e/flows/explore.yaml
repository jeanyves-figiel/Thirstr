# EN-16 (#175) Explore: map + Active now sheet, open the Testbot profile from the grid.
appId: app.thirstr
name: explore
---
- runFlow: dismiss.yaml
- tapOn:
    id: tab-Explore
- extendedWaitUntil:
    visible:
      id: grid-sheet
    timeout: 60000
- takeScreenshot: explore-map
- tapOn:
    id: sheet-handle
- scrollUntilVisible:
    element:
      text: "Testbot.*"
    direction: DOWN
    timeout: 60000
- takeScreenshot: explore-grid
- tapOn:
    text: "Testbot.*"
- extendedWaitUntil:
    visible:
      id: message-btn
    timeout: 60000
- takeScreenshot: explore-profile
