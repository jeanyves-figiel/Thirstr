# EN-16 (#175) cold start to the Welcome screen. TTI = launchApp + wait (measured from Maestro's command log).
appId: app.thirstr
name: launch
---
# Permissions are granted outside Maestro (adb install -g / simctl privacy); Maestro's names differ per OS.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: start
    timeout: 120000
- takeScreenshot: launch-welcome
