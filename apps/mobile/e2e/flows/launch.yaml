# EN-16 (#175) cold start to the Welcome screen. TTI = launchApp + wait (measured from Maestro's command log).
appId: app.thirstr
name: launch
---
# Permissions are granted outside Maestro (adb install -g / simctl privacy); Maestro's names differ per OS.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: start
    timeout: 60000
    optional: true
# Slow CI emulators: the system launcher can raise an "isn't responding" dialog over the app.
- repeat:
    times: 5
    while:
      notVisible:
        id: start
    commands:
      - runFlow: anr.yaml
      - extendedWaitUntil:
          visible:
            id: start
          timeout: 20000
          optional: true
- assertVisible:
    id: start
- takeScreenshot: launch-welcome
