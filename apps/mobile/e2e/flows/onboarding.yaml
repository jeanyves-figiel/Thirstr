# EN-16 (#175) sign-up through the DEV issuer ("Continue with Google" in EXPO_PUBLIC_ENV=dev builds),
# full onboarding, lands on Explore. Android hermetic stack only (testing.md › Device matrix).
appId: app.thirstr
name: onboarding
---
- tapOn:
    id: start
- extendedWaitUntil:
    visible:
      id: google
    timeout: 30000
- tapOn:
    id: google
- extendedWaitUntil:
    visible:
      id: name
    timeout: 60000
- tapOn:
    id: name
- inputText: E2E ${PROFILE}
- hideKeyboard
- tapOn:
    id: name-continue
- tapOn:
    id: birthday-continue
- tapOn:
    id: gender-man
# Picking a gender auto-advances after ~380 ms (Basics.tsx); Continue only if still shown.
- extendedWaitUntil:
    visible:
      id: here-hookup
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: identity-continue
    commands:
      - tapOn:
          id: identity-continue
- tapOn:
    id: here-hookup
# One intent is enough; the others are below the fold on 720×1280.
- tapOn:
    id: basics-continue
- extendedWaitUntil:
    visible:
      id: allow-location
    timeout: 60000
- takeScreenshot: onboarding-location
- scrollUntilVisible:
    element:
      id: closer-no
    direction: DOWN
    timeout: 10000
- tapOn:
    id: closer-no
- tapOn:
    id: allow-location
# Runtime permission dialog, in case launchApp's pre-grant did not stick
- runFlow:
    when:
      visible: "(While using the app|Only this time|Allow)"
    commands:
      - tapOn: "(While using the app|Only this time|Allow)"
# No position fix (emulators without Play services can't serve Balanced accuracy): the app falls
# back to the city picker. Pick Zürich so the account still lands near Testbot.
- runFlow:
    when:
      visible:
        id: city-search
    commands:
      - tapOn:
          id: city-search
      - inputText: Zurich
      - extendedWaitUntil:
          visible: "Zürich"
          timeout: 30000
      - tapOn: "Zürich"
- extendedWaitUntil:
    visible:
      id: photo-later
    timeout: 60000
- tapOn:
    id: photo-later
- extendedWaitUntil:
    visible:
      id: verify-later
    timeout: 60000
- tapOn:
    id: verify-later
- extendedWaitUntil:
    visible:
      id: done-continue
    timeout: 60000
- tapOn:
    id: done-continue
- extendedWaitUntil:
    visible:
      id: tab-Explore
    timeout: 90000
- takeScreenshot: onboarding-explore
