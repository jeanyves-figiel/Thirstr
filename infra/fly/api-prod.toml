# thirstr-api-prod (ops.md › Infra). EU regions only (D-03): CI rejects any other region.
app = "thirstr-api-prod"
primary_region = "fra"
kill_signal = "SIGTERM"
# SR-03: 30 s to drain requests/sockets and let Oban jobs finish (Oban grace 25 s).
kill_timeout = 30

[deploy]
  release_command = "/app/bin/migrate"
  strategy = "rolling"
  max_unavailable = 1

[env]
  DEPLOY_ENV = "prod"
  PHX_HOST = "api.thirstr.fun"
  APP_URL = "https://api.thirstr.fun"
  WEBAUTHN_ORIGIN = "https://api.thirstr.fun"
  WEBAUTHN_RP_ID = "api.thirstr.fun"
  PORT = "4000"
  ECTO_IPV6 = "true"
  # W-01 canonical marketing host (www redirects here; other hosts get noindex).
  SITE_HOST = "thirstr.fun"
  WELCOME_DEFAULT_CITY = "Zurich"
  S3_REGION = "auto"
  # Google iOS OAuth client (public, not a secret): audience for Sign in with Google ID tokens (#25).
  GOOGLE_CLIENT_IDS = "613900452555-cufeuuh30tsbea8j2rcv49s0d6vjspit.apps.googleusercontent.com"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2
  [http_service.concurrency]
    type = "connections"
    hard_limit = 10000
    soft_limit = 8000

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  path = "/v1/health"
  timeout = "5s"

# SR-07 (#147): Fly managed Prometheus scrapes the internal metrics port (not public).
[metrics]
  port = 9091
  path = "/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
